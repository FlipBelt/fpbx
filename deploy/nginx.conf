# 部署到 /etc/nginx/conf.d/reimbursement-assistant.conf
# 使用前请将 your-domain.com 替换为你的实际域名

server {
    listen 80;
    server_name your-domain.com;

    # 申请 HTTPS 证书前先用 HTTP 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;
    # Excel 明细可能内嵌几十张付款截图、发票图片。
    client_max_body_size 50m;

    # SSL 证书（用 certbot 申请后会自动生成）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # 安全头部
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # 静态资源缓存
    location /styles.css {
        proxy_pass http://127.0.0.1:8793;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /app.js {
        proxy_pass http://127.0.0.1:8793;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 钉钉审批 API - 反向代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（钉钉 API 可能较慢）
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # 主页面 - 反向代理到 Node.js
    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 日志
    access_log /var/log/nginx/reimbursement-assistant-access.log;
    error_log /var/log/nginx/reimbursement-assistant-error.log;
}
